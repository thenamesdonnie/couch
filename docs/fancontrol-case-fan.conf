# /etc/fancontrol - quiet CASE fan for donniespc (rewritten 7 Aug 2026)
#
# WHICH FAN IS WHICH (measured, not assumed - a 70s all-core load on 7 Aug):
#   Tctl 37C -> 77C ... fan2 ramped 1231 -> 2125 RPM   => fan2/pwm2 = CPU FAN
#                       fan1 sat at 1656 RPM throughout => fan1/pwm1 = CASE FAN
# The header numbering lied (fan1 is NOT the CPU header on this board), which
# is why the first version of this file quietened the wrong fan.
#
# So: pwm2 (CPU) is NEVER touched here - it stays on the board's own SmartFan
# curve, which the same test showed working properly. Only pwm1 (the case fan,
# which the board runs at a FLAT ~1650 RPM no matter the temperature, hence the
# constant noise) is managed.
#
# SENSOR CHOICE (revised 7 Aug after the fan audibly hunted): SYSTIN, the
# obvious case-fan sensor, is inert on this board (pinned at 32.0C through a
# load that took the CPU to 77C). CPU package temp works but Ryzen's Tctl is
# spiky - it idles at 37-43C yet flicks past 50C on trivial activity, so a
# ramp starting at 50 made the fan hunt up and down over nothing. The curve
# now follows GPU EDGE temperature: it moves slowly and smoothly, and the
# graphics card is what actually dumps heat into the case. The CPU keeps its
# own fan on the board's curve, so nothing is left unwatched.
# MEASURED LIMITS (fan-floor.sh, 7 Aug): this fan STALLS at duty 60 and needs
# duty 70 to start from rest. An earlier version of this file used 60 as the
# floor and stalled it dead. So the floor is 80 - a third above the measured
# stall, leaving margin for dust and bearing wear - and the restart kick is
# 110, well clear of the 70 it actually needs.
#   <= 55C GPU ->  pwm 80  (~31% duty, ~1140 RPM: idle, where it lives; the
#                            GPU sits at 47C doing nothing, well clear of 55)
#   55-85C     ->  ramps linearly to full
#   >= 85C     ->  pwm 255
# MINSTOP == MINPWM so the fan is never driven below its own floor.
#
# If fancontrol dies the kernel holds the last duty; the CPU fan and the GPU
# fan both remain on their own firmware curves regardless, so nothing here can
# leave a hot part uncooled.
INTERVAL=10

DEVPATH=hwmon1=devices/platform/nct6775.656 hwmon3=devices/pci0000:00/0000:00:03.1/0000:07:00.0/0000:08:00.0/0000:09:00.0
DEVNAME=hwmon1=nct6798 hwmon3=amdgpu

FCTEMPS=hwmon1/pwm1=hwmon3/temp1_input
FCFANS=hwmon1/pwm1=hwmon1/fan1_input

MINTEMP=hwmon1/pwm1=55
MAXTEMP=hwmon1/pwm1=85
MINSTART=hwmon1/pwm1=110
MINSTOP=hwmon1/pwm1=80
MINPWM=hwmon1/pwm1=80
MAXPWM=hwmon1/pwm1=255
