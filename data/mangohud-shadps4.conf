# MangoHud for shadPS4 only (the wrapper points MANGOHUD_CONFIGFILE here).
# Display: one big fps number the TV can actually show, plus the frame-time
# graph so a drop is visible as a spike even when the number rounds to 60.
fps
frame_timing
font_size=56
position=bottom-right
background_alpha=0.35
# Log everything per-frame for bb-drop-report: frametime + cpu/gpu load etc.
output_folder=/home/ds2000/couch/data/perf-logs
autostart_log=1
log_duration=14400
log_interval=0
toggle_logging=Shift_L+F2
