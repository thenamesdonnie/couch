# vkBasalt post-processing for Bloodborne under shadPS4 (3 Sep 2026).
# The Linux stand-in for the ReShade presets the Nexus graphics mods assume.
# Applied by ~/.local/bin/shadps4 when ~/couch/data/vkbasalt-off is ABSENT
# (touch that file to switch it off without touching anything else).
#
# Effects run in the order listed. SMAA first so the sharpen does not
# harden aliased edges, then CAS (AMD's contrast-adaptive sharpen) to bring
# back the detail the emulator's own FXAA smears. The game already renders at
# 1440p on this box, so the sharpen is kept moderate: 0.4 is "visible, not
# crunchy". Nothing here changes colour.
effects = smaa:cas

casSharpness = 0.4

smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25

# No hotkey: this box has no keyboard at the TV and the pad never reaches it.
toggleKey = None
enableOnLaunch = True
