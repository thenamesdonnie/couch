# couchd ownership switch - the ONE file both stacks read at runtime.
#
# EMPTY (the state this file ships in) = SHADOW MODE, which is exactly the
# console's behaviour before couchd existed: couchd logs what it WOULD do and
# the four legacy scripts do everything. Nothing in either stack changes
# behaviour while this list is empty.
#
# Naming a responsibility here flips it, live, one at a time:
#   * couchd EXECUTES the intents whose reason carries that responsibility;
#   * the legacy script that used to do it YIELDS - it still writes its
#     would-do line to /tmp/legacy-intents.jsonl (shadow reversal: legacy
#     becomes the shadow for that responsibility, which is what the differ
#     needs post-flip) but performs no action.
#
# The responsibilities are the C9 gate list, and the reason prefix couchd
# stamps on every intent is what routes it:
#
#   gestures     reason "gesture:*"     - the PS button's whole vocabulary
#                                         (tap/double/hold/long-hold, resume),
#                                         today pad-home-watcher's act()
#   transitions  reason "transition:*"  - the session start/end handover
#                                         (pad + screen + TV wake), today
#                                         game-launch
#   guard        reason "guard:*"       - the post-transition enforcement
#                                         window, today steam-input-guard
#   reconcile    reason "reconcile:*"   - the standing drift repairs, today
#                                         pad-home-watcher's reconcile()
#   input        stage 2 only           - the evdev grab + virtual pad; the
#                                         input PROCESS reads this name, and
#                                         flipping it is a declared COMBINED
#                                         cutover with gestures (stage-2 SR4)
#
# Rules that do not bend (charter):
#   * flips happen in a DAYTIME window with Donnie present, one responsibility
#     at a time, each after its own 5-minute couch acceptance;
#   * ROLLBACK, in order: empty this file FIRST (both stacks pick it up within
#     a tick, nothing restarts), and only then stop couchd if you want it gone.
#     Stopping it first is also safe - ownership is a LEASE, and the legacy
#     scripts take every responsibility back within 30 seconds of couchd's
#     status.json going stale - but you get a half-minute of neither stack
#     acting, and the ordering above costs nothing;
#   * `systemctl --user stop couchd` alone is therefore self-healing, not a
#     console owned by a corpse;
#   * a name that is not on the list above is REJECTED with a loud warning by
#     both stacks - a typo must never silently leave a responsibility with no
#     owner at all.
#
# Syntax: one COUCHD_OWNS= line, comma- or space-separated, quotes optional.
# The LAST such line in the file wins. `export` is not supported (bash sources
# nothing here; both parsers read the plain line).
#
#   COUCHD_OWNS="gestures"            # one responsibility, the first flip
#   COUCHD_OWNS="gestures,reconcile"  # two
#
COUCHD_OWNS="gestures input"
